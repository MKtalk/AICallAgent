plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.aicallagent.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.aicallagent.app'
        minSdk = 31
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        warningsAsErrors = false
        abortOnError = true
        checkReleaseBuilds = false
    }

    packaging {
        jniLibs {
            // Google ships this prebuilt already stripped (no .debug_* or .symtab sections).
            // Preserve the vetted binary; no local NDK strip tool is needed.
            keepDebugSymbols += '**/liblitertlm_jni.so'
        }
    }
}

dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    testImplementation 'junit:junit:4.13.2'
}

dependencyLocking {
    lockAllConfigurations()
}
